{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-speedometer2 me-2"></i>Supervisor Dashboard</h2>

<div class="row mb-4">
    <div class="col-md-4">
        <div class="card bg-primary text-white p-3 shadow-sm text-center">
            <h6>Total Scans</h6>
            <h2 id="total-picks">0</h2>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card bg-success text-white p-3 shadow-sm text-center">
            <h6>Approved</h6>
            <h2 id="approved-picks">0</h2>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card bg-danger text-white p-3 shadow-sm text-center">
            <h6>Rejected</h6>
            <h2 id="rejected-picks">0</h2>
        </div>
    </div>
</div>

<h4>Recent Audit Logs</h4>
<div class="table-responsive">
    <table class="table table-striped table-hover shadow-sm align-middle">
        <thead class="table-dark">
            <tr>
                <th>Log ID</th>
                <th>Order ID</th>
                <th>SKU</th>
                <th>Scanned Batch</th>
                <th>Scanned Expiry</th>
                <th>Result</th>
                <th>Errors</th>
                <th>Timestamp</th>
            </tr>
        </thead>
        <tbody id="logs-table-body">
            <tr><td colspan="8" class="text-center text-muted">Loading logs...</td></tr>
        </tbody>
    </table>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}
