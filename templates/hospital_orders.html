{% extends 'base.html' %}
{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
    <div>
        <h2 class="mb-1"><i class="bi bi-hospital me-2"></i>Hospital Orders</h2>
        <p class="text-muted mb-0">Request available medical supplies from KEMSA.</p>
    </div>
    <button type="button" class="btn btn-outline-secondary" onclick="loadHospitalOrders()">
        <i class="bi bi-arrow-clockwise me-1"></i>Refresh
    </button>
</div>
<div id="hospital-order-message"></div>
<div class="card shadow-sm mb-4">
    <div class="card-header bg-primary text-white"><h5 class="mb-0"><i class="bi bi-plus-circle me-2"></i>Make an Order</h5></div>
    <div class="card-body">
        <form id="hospital-order-form" class="row g-3">
            <div class="col-md-5">
                <label for="item_name" class="form-label">Medicine name</label>
                <input id="item_name" name="item_name" class="form-control" required placeholder="Paracetamol 500mg">
            </div>
            <div class="col-md-4">
                <label for="sku" class="form-label">Medical supply SKU</label>
                <input id="sku" name="sku" class="form-control" required placeholder="MED-601">
            </div>
            <div class="col-md-3">
                <label for="required_quantity" class="form-label">Quantity</label>
                <input id="required_quantity" name="required_quantity" type="number" min="1" class="form-control" required>
            </div>
            <div class="col-12"><button type="submit" class="btn btn-primary"><i class="bi bi-send me-1"></i>Submit Order</button></div>
        </form>
    </div>
</div>
<div class="table-responsive">
    <h5 class="mb-3"><i class="bi bi-list-check me-2"></i>My Orders</h5>
    <table class="table table-striped table-hover shadow-sm align-middle">
        <thead class="table-dark"><tr><th>Order</th><th>Medicine</th><th>SKU</th><th>Quantity</th><th>Status</th><th>Submitted</th><th>Action</th></tr></thead>
        <tbody id="hospital-orders-body"><tr><td colspan="7" class="text-center text-muted">Loading orders...</td></tr></tbody>
    </table>
</div>
{% endblock %}
{% block scripts %}
<script>
async function loadHospitalOrders() {
    const response = await fetch('/api/orders');
    const orders = await response.json();
    const body = document.getElementById('hospital-orders-body');
    if (!response.ok) {
        body.innerHTML = `<tr><td colspan="7" class="text-danger text-center">${orders.message || 'Unable to load orders'}</td></tr>`;
        return;
    }
    body.innerHTML = orders.length ? orders.map(order => `
        <tr><td><strong>#${order.order_id}</strong></td><td>${order.item_name}</td><td><code>${order.sku}</code></td>
        <td>${order.required_quantity}</td><td><span class="badge ${order.status === 'PENDING' ? 'bg-warning text-dark' : 'bg-success'}">${order.status === 'READY_FOR_DISPATCH' ? 'Verified and ready for dispatch' : order.status_label}</span></td><td>${order.created_at}</td>
        <td>${order.status === 'PENDING' ? `<button type="button" class="btn btn-sm btn-outline-danger" onclick="deleteHospitalOrder(${order.order_id})"><i class="bi bi-trash me-1"></i>Delete</button>` : '<span class="text-success small"><i class="bi bi-check-circle me-1"></i>Ready</span>'}</td></tr>
    `).join('') : '<tr><td colspan="7" class="text-center text-muted">No orders submitted yet.</td></tr>';
}

async function deleteHospitalOrder(orderId) {
    if (!confirm(`Delete order #${orderId}?`)) return;
    const response = await fetch(`/api/orders/${orderId}`, {method: 'DELETE'});
    const result = await response.json();
    const message = document.getElementById('hospital-order-message');
    message.innerHTML = `<div class="alert alert-${response.ok ? 'success' : 'danger'}">${result.message}</div>`;
    if (response.ok) await loadHospitalOrders();
}

document.getElementById('hospital-order-form').addEventListener('submit', async event => {
    event.preventDefault();
    const message = document.getElementById('hospital-order-message');
    const payload = Object.fromEntries(new FormData(event.target).entries());
    payload.required_quantity = Number(payload.required_quantity);
    try {
        const response = await fetch('/api/orders', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)});
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Unable to submit order');
        message.innerHTML = `<div class="alert alert-success"><i class="bi bi-check-circle me-1"></i>Order #${result.order.order_id} submitted and is pending verification.</div>`;
        event.target.reset();
        await loadHospitalOrders();
    } catch (error) {
        message.innerHTML = `<div class="alert alert-danger">${error.message}</div>`;
    }
});

loadHospitalOrders();
</script>
{% endblock %}
