{% extends 'base.html' %}
{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
    <h2 class="mb-0"><i class="bi bi-send-check me-2"></i>Dispatch Order Management</h2>
    <div class="d-flex gap-2">
        <button type="button" class="btn btn-outline-secondary" onclick="loadOrders()">
            <i class="bi bi-arrow-clockwise me-1"></i>Refresh Orders
        </button>
    </div>
</div>
<div id="order-message"></div>
<div class="card shadow-sm mb-4">
    <div class="card-header bg-primary text-white">
        <h5 class="mb-0"><i class="bi bi-plus-circle me-2"></i>Enter Dispatch Order Details</h5>
    </div>
    <div class="card-body">
        <form id="order-form" class="row g-3">
            <div class="col-md-2"><label class="form-label">SKU</label><input name="sku" class="form-control" required placeholder="MED-601"></div>
            <div class="col-md-2"><label class="form-label">Item Name</label><input name="item_name" class="form-control" required placeholder="Medical item"></div>
            <div class="col-md-2"><label class="form-label">Target Batch</label><input name="target_batch" class="form-control" required placeholder="BATCH-2026D"></div>
            <div class="col-md-2"><label class="form-label">Quantity</label><input name="required_quantity" type="number" min="1" class="form-control" required></div>
            <div class="col-md-2"><label class="form-label">Expiry</label><input name="expiry_date" type="date" class="form-control" required></div>
            <div class="col-md-2"><label class="form-label">Location</label><input name="location" class="form-control" required placeholder="Shelf D2"></div>
            <div class="col-md-2"><label class="form-label">Destination</label><input name="destination" class="form-control" required placeholder="Hospital"></div>
            <div class="col-md-2"><label class="form-label">Dispatcher Name</label><input name="dispatcher_name" class="form-control" required placeholder="Staff member on duty"></div>
            <div class="col-12"><button type="submit" class="btn btn-primary"><i class="bi bi-send me-1"></i>Create Order</button></div>
        </form>
    </div>
</div>
<div class="table-responsive">
    <h5 class="mb-3"><i class="bi bi-list-check me-2"></i>Dispatch Orders</h5>
    <table class="table table-striped table-hover shadow-sm align-middle">
        <thead class="table-dark">
            <tr>
                <th>Order ID</th>
                <th>SKU</th>
                <th>Item Name</th>
                <th>Target Batch</th>
                <th>Expiry Date</th>
                <th>Location</th>
                <th>Destination</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="orders-table-body">
            <tr><td colspan="9" class="text-center text-muted">Loading orders...</td></tr>
        </tbody>
    </table>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/orders.js') }}"></script>
{% endblock %}
