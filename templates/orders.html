{% extends 'base.html' %}
{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
    <h2 class="mb-0"><i class="bi bi-list-check me-2"></i>Active Picking Queue</h2>
    <div class="d-flex gap-2">
        <button type="button" class="btn btn-outline-secondary" onclick="loadOrders()">
            <i class="bi bi-arrow-clockwise me-1"></i>Refresh Orders
        </button>
        <a class="btn btn-primary" href="/verify">
            <i class="bi bi-qr-code-scan me-1"></i>Verify a Pick
        </a>
    </div>
</div>
<div class="table-responsive">
    <table class="table table-striped table-hover shadow-sm align-middle">
        <thead class="table-dark">
            <tr>
                <th>Order ID</th>
                <th>SKU</th>
                <th>Item Name</th>
                <th>Target Batch</th>
                <th>Expiry Date</th>
                <th>Location</th>
                <th>Destination</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="orders-table-body">
            <tr><td colspan="8" class="text-center text-muted">Loading orders...</td></tr>
        </tbody>
    </table>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/orders.js') }}"></script>
{% endblock %}
