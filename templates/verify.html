{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-qr-code-scan me-2"></i>Package Verification Station</h2>
<div id="alert-container"></div>

<div class="card shadow-sm p-4 col-md-8 mx-auto">
    <form id="verify-form">
        <div class="mb-3">
            <label class="form-label">Order ID</label>
            <input type="number" id="order_id" class="form-control" required placeholder="e.g. 1">
        </div>
        <div class="mb-3">
            <label class="form-label">Scanned SKU</label>
            <input type="text" id="sku" class="form-control" required placeholder="e.g. MED-101">
        </div>
        <div class="mb-3">
            <label class="form-label">Scanned Batch Code</label>
            <input type="text" id="batch_code" class="form-control" required placeholder="e.g. BATCH-2026A">
        </div>
        <div class="mb-3">
            <label class="form-label">Scanned Expiry Date</label>
            <input type="date" id="expiry_date" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-check-circle me-1"></i> Verify Pick</button>
    </form>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/verify.js') }}"></script>
{% endblock %}
